# =============================================================================
# Securicam — Apache vhost BEFORE the Let's Encrypt certificate is issued.
#
# 1. Edit the Define below to set your domain.
# 2. sudo cp docker/apache/securicam-pre-cert.conf /etc/apache2/sites-available/securicam.conf
# 3. sudo a2ensite securicam && sudo systemctl reload apache2
# 4. make prod-cert DOMAIN=securicam.verdier-developpement.fr EMAIL=you@example.com
# Certbot will install the cert; then replace with docker/apache/securicam.conf.
# =============================================================================

Define SECURICAM_DOMAIN securicam.verdier-developpement.fr

<VirtualHost *:80>
    ServerName  ${SECURICAM_DOMAIN}
    ServerAdmin webmaster@${SECURICAM_DOMAIN}

    # Webroot used by certbot for the HTTP-01 challenge.
    DocumentRoot /var/www/securicam-spa

    <Directory /var/www/securicam-spa>
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/securicam-error.log
    CustomLog ${APACHE_LOG_DIR}/securicam-access.log combined
</VirtualHost>
