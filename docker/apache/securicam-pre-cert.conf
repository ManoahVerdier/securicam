# =============================================================================
# Securicam — Apache vhost BEFORE the Let's Encrypt certificate is issued.
#
# Drop-in at /etc/apache2/sites-available/securicam.conf, then:
#   sudo a2ensite securicam && sudo systemctl reload apache2
#   sudo certbot --apache -d ${PUBLIC_HOST}
# Certbot will then rewrite this file into the full TLS version (or you can
# replace it with docker/apache/securicam.conf).
# =============================================================================

<VirtualHost *:80>
    ServerName  ${PUBLIC_HOST}
    ServerAdmin webmaster@${PUBLIC_HOST}

    # Webroot used by certbot for the HTTP-01 challenge.
    DocumentRoot /var/www/securicam-spa

    <Directory /var/www/securicam-spa>
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/securicam-error.log
    CustomLog ${APACHE_LOG_DIR}/securicam-access.log combined
</VirtualHost>
