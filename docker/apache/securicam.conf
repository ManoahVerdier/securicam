# =============================================================================
# Securicam — Apache 2.4 vhost (TLS termination + SPA + reverse proxy)
#
# Required Apache modules (enable with `sudo a2enmod`):
#   ssl rewrite headers proxy proxy_http proxy_fcgi proxy_wstunnel http2
#
# Layout:
#   /var/www/securicam-spa/         <- Angular SPA build artefacts
#   /opt/securicam/backend/public/  <- Laravel public/ (served via SCRIPT_FILENAME)
#                                      Apache itself does NOT read PHP files; it
#                                      proxies them via FastCGI to the php-fpm
#                                      container that listens on 127.0.0.1:9000.
#
# Reverse-proxy targets (containers expose ports on loopback):
#   /api, /sanctum, /broadcasting, /storage  ->  fcgi://127.0.0.1:9000
#   /app  (WSS for Reverb)                   ->  ws://127.0.0.1:8081
# =============================================================================

# -------- HTTP -> HTTPS redirect (keep ACME challenge accessible) -----------
<VirtualHost *:80>
    ServerName ${PUBLIC_HOST}

    # Let certbot keep using the webroot challenge for renewals.
    Alias /.well-known/acme-challenge/ /var/www/securicam-spa/.well-known/acme-challenge/
    <Directory "/var/www/securicam-spa/.well-known/acme-challenge/">
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/?(.*)$ https://%{HTTP_HOST}/$1 [R=301,L]
</VirtualHost>


# -------- Main HTTPS vhost --------------------------------------------------
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName  ${PUBLIC_HOST}
    ServerAdmin webmaster@${PUBLIC_HOST}

    Protocols h2 http/1.1

    # ---- TLS (managed by certbot --apache) --------------------------------
    SSLEngine on
    SSLCertificateFile      /etc/letsencrypt/live/${PUBLIC_HOST}/fullchain.pem
    SSLCertificateKeyFile   /etc/letsencrypt/live/${PUBLIC_HOST}/privkey.pem
    SSLProtocol             all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite          HIGH:!aNULL:!MD5:!3DES
    SSLHonorCipherOrder     on

    # ---- Security headers --------------------------------------------------
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options           "SAMEORIGIN"
    Header always set X-Content-Type-Options    "nosniff"
    Header always set Referrer-Policy           "strict-origin-when-cross-origin"

    # ---- Logs --------------------------------------------------------------
    ErrorLog  ${APACHE_LOG_DIR}/securicam-error.log
    CustomLog ${APACHE_LOG_DIR}/securicam-access.log combined

    # ---- Document root: Angular SPA ---------------------------------------
    DocumentRoot /var/www/securicam-spa
    <Directory /var/www/securicam-spa>
        Require all granted
        Options -Indexes
        AllowOverride None

        # SPA fallback: serve index.html for any unknown route.
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} !^/(api|sanctum|broadcasting|storage|app)(/|$)
        RewriteRule ^ /index.html [L]
    </Directory>

    # Long cache for hashed Angular assets.
    <FilesMatch "\.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$">
        Header set Cache-Control "public, max-age=2592000, immutable"
    </FilesMatch>

    # ---- Reverb WebSocket (wss://.../app) ---------------------------------
    # Pusher protocol uses /app/<key> URLs. Upgrade to WS via mod_proxy_wstunnel.
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/app/(.*) ws://127.0.0.1:8081/app/$1 [P,L]
    ProxyPass        /app  http://127.0.0.1:8081/app
    ProxyPassReverse /app  http://127.0.0.1:8081/app

    # ---- Laravel API (/api, /sanctum, /broadcasting, /storage) ------------
    # Serve via FastCGI directly. SCRIPT_FILENAME must match the path INSIDE
    # the php-fpm container (the backend/ folder is bind-mounted to /var/www).
    <LocationMatch "^/(api|sanctum|broadcasting|storage)(/|$)">
        # Tell php-fpm the script is /var/www/public/index.php inside the container.
        SetHandler "proxy:fcgi://127.0.0.1:9000"
        ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "/var/www/public/index.php"
        ProxyFCGISetEnvIf "true" SCRIPT_NAME     "/index.php"
        ProxyFCGISetEnvIf "true" DOCUMENT_ROOT   "/var/www/public"

        # Forward HTTPS info so Laravel builds correct absolute URLs.
        RequestHeader set X-Forwarded-Proto "https"
        RequestHeader set X-Forwarded-Port  "443"
    </LocationMatch>

    # Allow large request bodies (signed URLs, base64 captures, …).
    LimitRequestBody 52428800
</VirtualHost>
</IfModule>
