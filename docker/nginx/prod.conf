# ----------------------------------------------------------------------------
# HTTP -> HTTPS redirect + ACME challenge
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name securicam.verdier-developpement.fr;

    # Allow Let's Encrypt webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----------------------------------------------------------------------------
# Main HTTPS vhost: SPA + /api (PHP-FPM) + /app (Reverb WSS)
# ----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name securicam.verdier-developpement.fr;

    ssl_certificate     /etc/letsencrypt/live/securicam.verdier-developpement.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/securicam.verdier-developpement.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow large request bodies (signed URLs, base64 captures, etc.)
    client_max_body_size 50M;

    # ------------------------------------------------------------------------
    # Reverb WebSocket (subscribe + broadcast auth)
    # ------------------------------------------------------------------------
    location /app {
        proxy_pass http://reverb:8081;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # ------------------------------------------------------------------------
    # Laravel API : everything starting with /api/, /sanctum/, /broadcasting/
    # served by PHP-FPM via Laravel public/index.php
    # ------------------------------------------------------------------------
    location ~ ^/(api|sanctum|broadcasting|storage)(/|$) {
        root /var/www/public;
        try_files $uri /index.php?$query_string;
    }

    location ~ \.php$ {
        root /var/www/public;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        include fastcgi_params;
    }

    # ------------------------------------------------------------------------
    # Angular SPA fallback (everything else)
    # ------------------------------------------------------------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets aggressively
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
