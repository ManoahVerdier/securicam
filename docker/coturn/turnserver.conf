# coturn config — used both as STUN and TURN for WebRTC NAT traversal
# Replace REPLACE_ME_* values via env or rebuild.

listening-port=3478
tls-listening-port=5349

# Public IP of the VPS (REQUIRED — set in docker-compose env or override here)
# external-ip=YOUR.VPS.PUBLIC.IP

# Relay port range — must be opened on the host firewall (UDP)
min-port=49160
max-port=49200

# Authentication: long-term credentials shared with frontend & Android
lt-cred-mech
realm=securicam.verdier-developpement.fr

# Single static user (override in production)
user=securicam:CHANGE_ME_TURN_PASSWORD

# Logs
no-stdout-log
log-file=/var/log/turnserver.log
syslog
verbose

# Security: avoid being used as open relay
no-loopback-peers
no-multicast-peers
no-tlsv1
no-tlsv1_1

# Optional TLS (uncomment + provide certs to enable TURNS over 5349)
# cert=/etc/letsencrypt/live/securicam.verdier-developpement.fr/fullchain.pem
# pkey=/etc/letsencrypt/live/securicam.verdier-developpement.fr/privkey.pem

fingerprint
