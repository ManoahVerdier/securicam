# =============================================================================
# Securicam — production stack (Apache front, dockerized backend services)
#
# The host runs Apache 2.4 (with mod_proxy_fcgi + mod_proxy_wstunnel + SSL)
# and reverse-proxies everything to the containers below. Containers therefore
# expose their ports ONLY on 127.0.0.1 (loopback) — they are not reachable
# directly from the public Internet.
#
# Public surface (opened on host firewall):
#   - 80, 443/tcp                 : Apache (TLS termination, SPA, /api, /app)
#   - 3478/udp+tcp, 49160-49200/udp : coturn (STUN/TURN, host network)
#
# All secrets live in `.env.prod` (copy from .env.prod.example, never commit).
# =============================================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securicam-backend
    restart: unless-stopped
    working_dir: /var/www
    # Fix permissions on bind-mounted storage/database so php-fpm (www-data)
    # can write capture uploads and the SQLite DB. Then run migrations and
    # caches before starting php-fpm. `php artisan storage:link` is required
    # for /storage/* URLs to resolve to storage/app/public/*.
    command: sh -c "mkdir -p /var/www/storage/app/public /var/www/storage/app/public/captures; chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache /var/www/database 2>/dev/null; chmod -R u+rwX,g+rwX /var/www/storage /var/www/bootstrap/cache 2>/dev/null; chmod 664 /var/www/database/database.sqlite 2>/dev/null; php artisan storage:link --force 2>/dev/null || true; php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan event:cache && php-fpm"
    volumes:
      - ./backend:/var/www
      - sqlite_data:/var/www/database
    env_file:
      - .env.prod
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=reverb
      - REVERB_HOST=reverb
      - REVERB_PORT=8081
      - REVERB_SCHEME=http
    # Expose php-fpm on loopback only — Apache (host) talks to it via proxy_fcgi.
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      redis:
        condition: service_started
    networks:
      - securicam-network
    mem_limit: 512m
    memswap_limit: 768m

  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securicam-reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    volumes:
      - ./backend:/var/www
      - sqlite_data:/var/www/database
    env_file:
      - .env.prod
    environment:
      - APP_ENV=production
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    # Apache (host) reverse-proxies wss://.../app to this on loopback.
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - securicam-network
    mem_limit: 256m
    memswap_limit: 384m

  redis:
    image: redis:alpine
    container_name: securicam-redis
    restart: unless-stopped
    networks:
      - securicam-network
    mem_limit: 128m
    memswap_limit: 192m

  # ----------------------------------------------------------------------
  # coturn = STUN + TURN. Host networking so it advertises the real public
  # IP correctly. Required for WebRTC over the Internet (CGNAT, 4G, etc.).
  # ----------------------------------------------------------------------
  coturn:
    image: coturn/coturn:latest
    container_name: securicam-coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: >-
      -c /etc/coturn/turnserver.conf
      --external-ip=${PUBLIC_IP}
      --user=${TURN_USER}:${TURN_PASSWORD}
    mem_limit: 256m
    memswap_limit: 384m

networks:
  securicam-network:
    driver: bridge

volumes:
  sqlite_data:
    driver: local
