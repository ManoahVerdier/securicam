version: '3.8'

services:
  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securicam-backend
    restart: unless-stopped
    working_dir: /var/www
    # Run migrations before starting PHP-FPM so dependent services (reverb) can wait
    command: >-
      sh -c "php artisan migrate --force && php-fpm"
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=securicam
      - DB_USERNAME=securicam
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=securicam
      - REVERB_APP_KEY=securicam-app-key
      - REVERB_APP_SECRET=securicam-app-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8081
    healthcheck:
      test: ["CMD", "php", "artisan", "migrate:status"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - securicam-network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: securicam-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - securicam-network

  # Laravel Reverb WebSocket Server
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securicam-reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8081
    ports:
      - "8081:8081"
    volumes:
      - ./backend:/var/www
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=securicam
      - DB_USERNAME=securicam
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REVERB_APP_ID=securicam
      - REVERB_APP_KEY=securicam-app-key
      - REVERB_APP_SECRET=securicam-app-secret
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - securicam-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: securicam-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=securicam
      - MYSQL_USER=securicam
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-usecuricam", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - securicam-network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: securicam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - securicam-network

  # Angular Frontend (Development)
  frontend:
    image: node:20-alpine
    container_name: securicam-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install && npm start -- --host 0.0.0.0"
    networks:
      - securicam-network

networks:
  securicam-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
