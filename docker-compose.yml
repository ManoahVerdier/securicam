version: '3.8'

services:
  # Laravel Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securicam-backend
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./backend:/var/www
      - ./backend/storage:/var/www/storage
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=securicam
      - DB_USERNAME=securicam
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=securicam
      - REVERB_APP_KEY=securicam-app-key
      - REVERB_APP_SECRET=securicam-app-secret
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
    depends_on:
      - db
      - redis
    networks:
      - securicam-network

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: securicam-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - securicam-network

  # Laravel Reverb WebSocket Server
  reverb:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securicam-reverb
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/var/www
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=securicam
      - DB_USERNAME=securicam
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REVERB_APP_ID=securicam
      - REVERB_APP_KEY=securicam-app-key
      - REVERB_APP_SECRET=securicam-app-secret
    depends_on:
      - backend
      - redis
    networks:
      - securicam-network

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: securicam-db
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=securicam
      - MYSQL_USER=securicam
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - securicam-network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: securicam-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - securicam-network

  # Angular Frontend (Development)
  frontend:
    image: node:20-alpine
    container_name: securicam-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:4200"
    command: sh -c "npm install && npm start -- --host 0.0.0.0"
    networks:
      - securicam-network

networks:
  securicam-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
